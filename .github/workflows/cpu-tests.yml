name: CPU software tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTHONDONTWRITEBYTECODE: "1"
      YOLO_OFFLINE: "true"
      YOLO_AUTOINSTALL: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CPU wheels and isolated test extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]" -c constraints/cpu.txt
          python -m pip check
      - name: Assert CPU-only environment
        run: python -c "import torch; assert torch.version.cuda is None; assert not torch.cuda.is_available()"
      - name: Run synthetic and mocked software tests
        run: python -m pytest tests integrations/bevformer/test_run.py -q -p no:cacheprovider --basetemp=runs/ci-test-temp
      - name: Check CLI entry point
        run: python -m camera_rc --help
